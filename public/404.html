<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Quantum Adventure | Ayush Docs</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which will cause the browser to refresh the page without losing the route.
      // Since we use HashRouter, it's even simpler: we just redirect to the hash version.
      
      var pathSegmentsToKeep = 1;

      var l = window.location;
      var path = l.pathname.split('/').slice(pathSegmentsToKeep + 1).join('/');
      
      if (path) {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, pathSegmentsToKeep + 1).join('/') + '/#/' + path +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      } else {
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname.split('/').slice(0, pathSegmentsToKeep + 1).join('/') + '/');
      }
    </script>
  </head>
  <body>
    Redirecting to the Quantum Adventure...
  </body>
</html>
